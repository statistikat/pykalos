[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "pykalos"
version = "0.1.0"
description = "Minimal Python bindings to the Kalos C++ time-series engine"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}

[project.urls]
Repository = "https://github.com/statistikat/pykalos"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/pykalos"]
sdist.include = ["vendor/kalos/**", "vendor/kalos-evidence/**", "core.lock.json", "tools/sync-core.py"]
